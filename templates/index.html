<html>                                              <!-- html 문서 시작 -->
    <head></head>                                   <!-- 문서의 제목/설정 등을 넣는 곳 -->
    <body>                                          <!-- 화면에 표시할 내용 -->
        <h1>안녕하세요 잡스크래퍼입니다.</h1>           <!-- <h1> : 가장 큰 제목, </h1> : 제목 끝 -->
        <form action="/search">                         <!-- 사용자가 입력한 정보를 제출하기 위한 영역 -->
            <input type="text" name="keyword" />        <!-- input type="text" : 문자를 입력할 수 있는 검색창을 만드는 코드 -->
                                                        <!-- name="keyword" : 사용자가 입력한 값에 keyword 이름 붙여서 서버로 전달 -->
            <button>검색하기</button>                    <!-- 버튼을 만드는 코드 -->
        </form>
    </body>                                         <!-- 화면 내용 끝 -->
</html>                                             <!-- 문서 끝 -->

<!-- 파이썬의 print() 는 터미널에 출력하지만, html의 <h1>은 웹페이지에 제목을 표시 -->

<!-- templates에 index.html : 화면담당 / search.html : 검색 결과 화면용 -->
